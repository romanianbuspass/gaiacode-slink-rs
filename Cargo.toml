[package]
name = "gaiacode-slink-rs"
version = "0.1.0"
edition = "2021"
description = "Async SeedLink client and miniSEED record parsing for GaiaCode tooling (GaiaArgus et al.)"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
